version: '3.8'

services:
  waifuscrper:
    build: .
    container_name: waifuscrper_bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      - mongo

  mongo:
    image: mongo:6.0
    container_name: waifuscrper_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
